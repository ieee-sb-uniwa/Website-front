version: "3.8"

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_IMAGES_STORAGE_URL: ${NEXT_PUBLIC_IMAGES_STORAGE_URL}
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: always

networks:
  common-network:
    external: true
